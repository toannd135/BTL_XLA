<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fruit dataset review</title>
  <style>
    :root{font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;color:#1e293b;background:#f1f5f2}*{box-sizing:border-box}body{margin:0}
    header{position:sticky;top:0;background:#fff;border-bottom:1px solid #cbd5d1;padding:12px 18px;z-index:5;box-shadow:0 2px 8px #0001}
    h1{font-size:19px;margin:0 0 8px}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:3px}label{font-size:12px;color:#475569}select,input,textarea,button{font:inherit;border:1px solid #cbd5e1;border-radius:5px;padding:6px;background:white}button{cursor:pointer}button:hover{background:#f1f5f9}.progress{font-size:12px;color:#475569;margin-top:8px}.warning{color:#92400e;font-size:12px;margin-top:5px}
    main{max-width:1600px;margin:16px auto;padding:0 14px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(580px,1fr));gap:12px}.card{background:white;border:1px solid #d5ded9;border-radius:8px;padding:10px;box-shadow:0 1px 3px #00008}.card-head{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #e2e8f0;padding-bottom:7px;margin-bottom:8px}.title{font-weight:700;overflow-wrap:anywhere}.badge{font-size:11px;background:#edf3ee;padding:3px 7px;border-radius:99px;white-space:nowrap}.high{background:#ffedd5;color:#9a3412}.panels{display:grid;grid-template-columns:1fr 1fr;gap:8px}.panel-title{font-size:12px;color:#475569;margin:0 0 4px}.image-wrap{position:relative;width:100%;min-height:140px;background:#f8fafc;border:1px solid #e2e8f0}.image-wrap canvas{display:block;width:100%;height:auto;max-height:460px;object-fit:contain}.crop-wrap{display:flex;align-items:center;justify-content:center;min-height:140px;background:#f8fafc;border:1px solid #e2e8f0}.crop-wrap img{max-width:100%;max-height:460px;object-fit:contain}.meta{font-size:12px;color:#334155;white-space:pre-wrap;margin:8px 0}.actions{border-top:1px solid #e2e8f0;padding-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.notes{grid-column:1/-1;min-height:54px;resize:vertical}.action-buttons{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}.action-buttons button{font-size:12px}.good{border-color:#15803d;color:#166534}.bad{border-color:#dc2626;color:#b91c1c}.amb{border-color:#d97706;color:#92400e}.save{background:#eff6ff}.pager{display:flex;justify-content:center;gap:12px;align-items:center;padding:20px}.empty{padding:30px;text-align:center;color:#64748b;background:#fff;border-radius:8px}.small{font-size:11px;color:#64748b}.right{margin-left:auto;display:flex;gap:8px}.cue{color:#9a3412}.detail-row{font-size:11px;color:#64748b;margin-top:4px}@media(max-width:700px){.cards{grid-template-columns:1fr}.panels{grid-template-columns:1fr}.card{padding:8px}.toolbar{gap:6px}}
  </style>
</head>
<body>
<header>
  <h1>Kiểm duyệt dataset fruit classification</h1>
  <div class="toolbar">
    <div class="field"><label for="fruit">Loại quả</label><select id="fruit"><option value="all">Tất cả</option><option>banana</option><option>apple</option><option>orange</option></select></div>
    <div class="field"><label for="split">Split (cố định)</label><select id="split"><option value="all">Tất cả</option><option value="train">Train</option><option value="val">Validation</option><option value="test">Test</option></select></div>
    <div class="field"><label for="category">Review category</label><select id="category"><option value="all">Tất cả</option></select></div>
    <div class="field"><label for="status">Trạng thái</label><select id="status"><option value="pending">Pending</option><option value="verified">Verified</option><option value="incorrect">Incorrect</option><option value="ambiguous">Ambiguous</option><option value="all">Tất cả</option></select></div>
    <div class="field"><label for="reviewer">Reviewer ID</label><input id="reviewer" placeholder="Nhập ID người duyệt"></div>
    <div class="right"><a href="/review_export.csv" download><button>Export quyết định</button></a><a href="/review_progress.csv" download><button>Tải progress CSV</button></a><a href="/review_progress_report.md" download><button>Báo cáo tiến độ</button></a></div>
  </div>
  <div class="progress" id="progress">Đang tải tiến độ…</div>
  <div class="warning">Chỉ lưu quyết định review vào file riêng. Ảnh, nhãn gốc, test split và model không bị sửa. Xem ảnh nguồn trước khi xác nhận crop.</div>
</header>
<main><div id="cards" class="cards"></div><div class="pager"><button id="prev">Trước</button><span id="page"></span><button id="next">Tiếp</button></div></main>
<script>
const $=s=>document.querySelector(s), pageSize=24;let offset=0,total=0;const labels={banana:'Chuối',apple:'Táo',orange:'Cam'};
const reviewer=$('#reviewer');reviewer.value=localStorage.getItem('fruit-reviewer-id')||'';reviewer.addEventListener('change',()=>localStorage.setItem('fruit-reviewer-id',reviewer.value.trim()));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function getJSON(url){let r=await fetch(url);if(!r.ok)throw Error(await r.text());return r.json()}
async function loadOptions(){let o=await getJSON('/api/options');for(const c of o.categories){let x=document.createElement('option');x.value=c;x.textContent=c.replaceAll('_',' ');$('#category').appendChild(x)};loadProgress()}
async function loadProgress(){const p=await getJSON('/api/progress');$('#progress').textContent=`Đã review ${p.reviewed_items}/${p.queue_items} (${p.review_progress_percent}%) · pending ${p.pending_items} · verified ${p.status_counts.verified} · incorrect ${p.status_counts.incorrect} · ambiguous ${p.status_counts.ambiguous}`}
function draw(canvas,url,boxes,selected){const img=new Image();img.onload=()=>{const ctx=canvas.getContext('2d');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;ctx.drawImage(img,0,0);for(const b of boxes||[]){const x1=Number(b.bbox_xyxy_pixels?.[0]),y1=Number(b.bbox_xyxy_pixels?.[1]),x2=Number(b.bbox_xyxy_pixels?.[2]),y2=Number(b.bbox_xyxy_pixels?.[3]);if(![x1,y1,x2,y2].every(Number.isFinite))continue;const cls=b.label||'unknown';const color=cls==='banana'?'#12a83b':cls==='apple'?'#2563eb':'#f97316';ctx.strokeStyle=color;ctx.lineWidth=(b.annotation_id===selected?5:3);ctx.strokeRect(x1,y1,x2-x1,y2-y1);ctx.font='bold 20px sans-serif';const text=`${cls}${b.annotation_id?' '+b.annotation_id.split(':').pop():''}`;ctx.fillStyle=color;const tw=ctx.measureText(text).width+10;ctx.fillRect(x1,Math.max(0,y1-26),tw,25);ctx.fillStyle='white';ctx.fillText(text,x1+5,Math.max(19,y1-7));}};img.onerror=()=>{const ctx=canvas.getContext('2d');canvas.width=500;canvas.height=180;ctx.fillText('Ảnh nguồn không tải được',10,30)};img.src=url}
function buildCard(r){const card=document.createElement('article');card.className='card';const cls=r.fruits.length?r.fruits.map(x=>labels[x]).join(', '):'chưa có nhãn quả';const p=r.priority?`Ưu tiên ${r.priority}`:'Review thường';
 const head=document.createElement('div');head.className='card-head';const t=document.createElement('div');t.className='title';t.textContent=`${r.image} · ${r.review_item_type==='whole_image_missing_annotation_check'?'kiểm tra thiếu annotation':'review instance'}`;const badge=document.createElement('span');badge.className='badge '+(r.priority>=75?'high':'');badge.textContent=`${r.review_status} · ${p}`;head.append(t,badge);
 const panels=document.createElement('div');panels.className='panels';const source=document.createElement('div');source.innerHTML='<div class="panel-title">Ảnh nguồn + box</div>';const canvas=document.createElement('canvas');canvas.className='image-wrap';source.appendChild(canvas);const crop=document.createElement('div');crop.innerHTML='<div class="panel-title">Crop classifier</div>';const cropBox=document.createElement('div');cropBox.className='crop-wrap';if(r.crop_path){const im=document.createElement('img');im.src='/asset/crop?id='+encodeURIComponent(r.review_item_id);cropBox.appendChild(im)}else{cropBox.textContent='Mục kiểm tra ảnh nguồn; không có crop riêng'}crop.appendChild(cropBox);panels.append(source,crop);
 const meta=document.createElement('div');meta.className='meta';const allLabels=r.all_annotations?.map(x=>`${x.label} ${JSON.stringify(x.bbox_xyxy_pixels)} (${x.source_geometry})`).join('\n')||r.original_label;meta.textContent=`Image ID: ${r.image_id}\nNhãn gốc: ${r.original_label}\nBox mục này: ${r.bbox_xyxy_pixels||'—'}\nSplit: ${r.split} · cue: ${r.error_category||'none'}\n${r.decision_category?`Kết luận category: ${r.decision_category}\n`:''}${r.reviewed_at_utc?`Reviewer: ${r.reviewer_id} · ${r.reviewed_at_utc}\n`:''}`;
 const controls=document.createElement('div');controls.className='actions';const suggested=document.createElement('select');suggested.className='suggested';suggested.innerHTML='<option value="">Gợi ý nhãn (tuỳ chọn)</option>'+['banana','apple','orange'].map(x=>`<option value="${x}">${labels[x]}</option>`).join('');suggested.value=r.suggested_label||'';
 const category=document.createElement('select');category.className='finding';category.innerHTML='<option value="none">Category: không có lỗi xác nhận</option>'+[['incorrect_class_label','Sai class'],['missing_fruit_annotation','Thiếu quả/annotation'],['incorrect_bounding_box','Sai bounding box'],['multiple_fruits_in_crop','Nhiều quả trong crop'],['excessive_background','Crop dư nền'],['foreign_class_in_crop','Crop dính lớp quả khác'],['duplicate_content','Ảnh trùng'],['ambiguous','Mơ hồ']].map(([v,n])=>`<option value="${v}">${n}</option>`).join('');category.value=r.decision_category||'none';
 const notes=document.createElement('textarea');notes.className='notes';notes.placeholder='Ghi chú người duyệt…';notes.value=r.reviewer_notes||'';
 const buttons=document.createElement('div');buttons.className='action-buttons';const actions=[['Xác nhận nhãn / đầy đủ','verified','none','good'],['Sai nhãn','incorrect','incorrect_class_label','bad'],['Thiếu quả','incorrect','missing_fruit_annotation','bad'],['Sai bounding box','incorrect','incorrect_bounding_box','bad'],['Mơ hồ','ambiguous','ambiguous','amb'],['Ghi nhận cue đã chọn','ambiguous',null,'save']];
 for(const [text,status,cat,style] of actions){const b=document.createElement('button');b.textContent=text;b.className=style;b.onclick=()=>save(r,b,status,cat||category.value,suggested.value,notes.value);buttons.appendChild(b)}
 controls.append(suggested,category,notes,buttons);card.append(head,panels,meta,controls);
 const boxes=(r.all_annotations||[]).map(x=>({label:x.label,bbox_xyxy_pixels:x.bbox_xyxy_pixels,annotation_id:x.annotation_id}));draw(canvas,'/asset/source?id='+encodeURIComponent(r.review_item_id),boxes,r.review_item_id);
 return card}
async function loadRows(){const qs=new URLSearchParams({class:$('#fruit').value,split:$('#split').value,category:$('#category').value,status:$('#status').value,offset:String(offset),limit:String(pageSize)});const data=await getJSON('/api/rows?'+qs);total=data.total;const host=$('#cards');host.replaceChildren();for(const r of data.rows)host.appendChild(buildCard(r));$('#page').textContent=total?`${offset+1}–${Math.min(offset+pageSize,total)} / ${total}`:'Không có mục phù hợp';$('#prev').disabled=offset===0;$('#next').disabled=offset+pageSize>=total;loadProgress()}
async function save(r,button,status,category,suggested,notes){const reviewerId=reviewer.value.trim();if(!reviewerId){alert('Nhập Reviewer ID trước khi lưu.');reviewer.focus();return}if((category==='incorrect_class_label'||category==='missing_fruit_annotation')&&!suggested){if(!confirm('Chưa có gợi ý nhãn. Vẫn lưu quyết định này?'))return}button.disabled=true;try{const response=await fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({review_item_id:r.review_item_id,review_status:status,error_category:category,suggested_label:suggested,reviewer_notes:notes,reviewer_id:reviewerId})});const result=await response.json();if(!response.ok)throw Error(result.error||'Save failed');await loadRows()}catch(e){alert('Không lưu được: '+e.message);button.disabled=false}}
for(const id of ['fruit','split','category','status'])$('#'+id).addEventListener('change',()=>{offset=0;loadRows()});$('#prev').onclick=()=>{offset=Math.max(0,offset-pageSize);loadRows()};$('#next').onclick=()=>{if(offset+pageSize<total){offset+=pageSize;loadRows()}};
loadOptions().then(loadRows).catch(e=>{$('#cards').textContent='Lỗi tải review queue: '+e.message});
</script></body></html>
